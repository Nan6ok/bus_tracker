<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港公交实时追踪 | Hong Kong Bus Tracker</title>
    <!-- Mapbox -->
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 本地样式 -->
    <link rel="stylesheet" href="style.css">
    <!-- Mapbox Token 配置 -->
    <script>
        const MAPBOX_TOKEN = 'pk.eyJ1IjoibWFwYm94IiwiYSI6ImNpejY4M29iazA2Z2gycXA4N2pmbDZmangifQ.-g_vE53SD2WrJ6tFX7QHmA';
        // 注意：这是Mapbox的公开示例token，建议您替换为自己的token
    </script>
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <!-- 控制面板 -->
    <div class="control-panel">
        <div class="header">
            <h1><i class="fas fa-bus"></i> 香港公交实时追踪</h1>
            <p class="subtitle">Hong Kong Real-time Bus Tracker</p>
        </div>
        
        <!-- 筛选器 -->
        <div class="filters">
            <div class="filter-group">
                <label><i class="fas fa-building"></i> 巴士公司</label>
                <div class="company-buttons">
                    <button class="company-btn active" data-company="">全部</button>
                    <button class="company-btn" data-company="KMB" style="background:#E21836;">九巴</button>
                    <button class="company-btn" data-company="CTB" style="background:#1E5AA8;">城巴</button>
                    <button class="company-btn" data-company="NLB" style="background:#00A651;">屿巴</button>
                </div>
            </div>
            
            <div class="filter-group">
                <label><i class="fas fa-route"></i> 线路筛选</label>
                <input type="text" id="route-filter" placeholder="输入线路编号 (如: 101)">
            </div>
        </div>
        
        <!-- 统计信息 -->
        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="vehicle-count">0</div>
                <div class="stat-label">活跃车辆</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="route-count">0</div>
                <div class="stat-label">显示线路</div>
            </div>
            <div class="update-time">
                <i class="fas fa-sync-alt"></i> 更新时间: <span id="update-time">--:--:--</span>
            </div>
        </div>
        
        <!-- 操作按钮 -->
        <div class="actions">
            <button id="refresh-btn" class="btn primary">
                <i class="fas fa-sync-alt"></i> 刷新数据
            </button>
            <button id="locate-btn" class="btn">
                <i class="fas fa-location-arrow"></i> 我的位置
            </button>
            <button id="fullscreen-btn" class="btn">
                <i class="fas fa-expand"></i> 全屏
            </button>
        </div>
        
        <!-- 说明 -->
        <div class="info">
            <p><i class="fas fa-info-circle"></i> 此页面展示香港公交实时位置模拟数据</p>
            <p><small>数据更新频率: 每30秒</small></p>
        </div>
    </div>
    
    <!-- 地图控制按钮 -->
    <div class="map-controls">
        <button id="zoom-in"><i class="fas fa-plus"></i></button>
        <button id="zoom-out"><i class="fas fa-minus"></i></button>
        <button id="reset-view"><i class="fas fa-home"></i></button>
    </div>
    
    <!-- 车辆详情卡片 -->
    <div id="vehicle-details" class="vehicle-card hidden">
        <div class="card-header">
            <h3>车辆详情</h3>
            <button class="close-btn">&times;</button>
        </div>
        <div class="card-body">
            <div class="loading">点击地图上的车辆图标查看详情</div>
        </div>
    </div>
    
    <!-- 图例 -->
    <div class="legend">
        <h4><i class="fas fa-key"></i> 图例</h4>
        <div class="legend-item">
            <span class="color-box" style="background:#E21836;"></span>
            <span>九巴 KMB</span>
        </div>
        <div class="legend-item">
            <span class="color-box" style="background:#1E5AA8;"></span>
            <span>城巴 CTB</span>
        </div>
        <div class="legend-item">
            <span class="color-box" style="background:#00A651;"></span>
            <span>新大屿山 NLB</span>
        </div>
        <div class="legend-item">
            <span class="color-box" style="background:#FF6600;"></span>
            <span>龙运 LWB</span>
        </div>
    </div>
    
    <!-- 脚本 -->
    <script src="app.js"></script>
</body>
</html>
